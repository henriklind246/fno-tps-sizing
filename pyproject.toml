[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fno-tps-sizing"
version = "0.1.0"
description = "Time-conditioned Fourier neural operator for FV-verified TPS sizing"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "torch==2.7.0",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]
plot = ["matplotlib==3.10.8"]

[project.scripts]
fno-tps = "fno_tps.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: numerical convergence or end-to-end tests",
]

