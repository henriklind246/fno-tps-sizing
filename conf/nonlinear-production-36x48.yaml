# Mesh-refined counterpart of conf/nonlinear-pilot.yaml.
#
# The pilot mesh (18x24) is annotated "convergence checks are required before
# promotion". This config is the first refinement step: every cell count is
# doubled in both directions, giving 36x48. Nothing else differs from the
# pilot config, so the mesh is the only controlled variable between the two
# datasets and their trained surrogates.
#
# Keep this file in sync with conf/nonlinear-pilot.yaml when the physics,
# sampling, or training blocks change. `load_study_config` has no include
# mechanism, so the duplication is deliberate: `fno-tps train` compares the
# hash of this file against manifest.study_config_sha256, and a single
# committed file is the only way to guarantee the generate and train jobs
# agree.
study_id: tps_fno_li900_rcg_anisotropic_1atm_v2_mesh36x48
authoritative: true
seed: 42
initial_temperature: 300.0
lateral_length: 0.20
bond_thickness: 2.5e-4
backing_thickness: 2.0e-3
thickness_candidates:
  - 0.003
  - 0.005
  - 0.007
  - 0.009
  - 0.012
  - 0.015
  - 0.018
  - 0.021
  - 0.024
limits:
  bond_temperature: 450.0
  structural_interface_temperature: 400.0
validity:
  tps_property_model: temperature_dependent_table
  hot_face:
    # Declared study limit, not a fundamental material threshold.
    study_temperature_limit: 1400.0
    material_multiple_use_limit: 1590.0
  property_tables:
    allow_extrapolation: false
    minimum_temperature: 300.0
    maximum_temperature: 1400.0
  max_property_relative_deviation: 0.20
  conductivity_reference_pressure: 101330.0
  reject_cases_outside_validity: true
  reject_on_property_extrapolation: true
  reject_on_nonlinear_failure: true
  reject_on_nonphysical_temperature: true
  reject_on_energy_residual: true
  minimum_physical_temperature: 0.0
  max_relative_energy_residual: 1.0e-7
surface:
  model: incident_heat_flux_with_reradiation
  radiation_coupling: coupled_nonlinear
  emissivity_model: constant
  emissivity: 0.76
  coating: RCG_Class_2
  condition: virgin_as_fabricated
  emissivity_quantity: total_hemispherical
  emissivity_basis: Conservative lower bound over 300–1400 K from the reported 0.83 at room temperature to 0.76 at 1905 K
  emissivity_source: Bouslog and Cunnington, Emittance Measurements of RCG Coated Shuttle Tiles, AIAA 92-0851
  emissivity_source_url: https://ntrs.nasa.gov/citations/19920046993
  emissivity_authoritative: true
  emissivity_temperature_min: 300.0
  emissivity_temperature_max: 1400.0
  radiation_sink_temperature: 300.0
  stefan_boltzmann_constant: 5.670374419e-8
  nonlinear_absolute_flux_tolerance: 1.0e-7
  nonlinear_relative_tolerance: 1.0e-10
  nonlinear_max_iterations: 100
  nonlinear_relaxation: 0.80
recent_window_fraction: 0.10
cases_per_stratum: 12
max_stage_a_cases: 1500
materials:
  tps:
    model: temperature_dependent_table
    reference_k: 0.05124798686711595
    reference_k_y: 0.07194798398709752
    reference_rho_c: 102045.8386193291
    property_table:
      path: materials/tps_li900_rcg_authoritative.yaml
      version: TPSX-LI900-RCG-1ATM-v1
      content_sha256: 3bdc9c6800bcebb59db79a02d4cf5763afcc41983cec0f6d8b25072051f91e4a
      extrapolation: reject
      interpolation: linear
      reference_temperature: 300.0
  backing:
    k: 226.0
    rho_c: 2.484e6
solver:
  nonlinear:
    max_iterations: 25
    residual_temperature_tolerance: 1.0e-8
    update_temperature_tolerance: 1.0e-8
    update_relative_tolerance: 1.0e-10
    initial_damping: 1.0
    minimum_damping: 0.015625
    max_temperature_step: 250.0
    armijo_c: 1.0e-4
    max_backtracks: 6
bond:
  k0: 0.397
  k_min: 0.040
  rho_c: 1.6497e6
  severity: {min: 0.40, max: 0.90}
  y_center: {min: 0.030, max: 0.170}
  sigma: {min: 0.010, max: 0.025}
  max_defects: 2
heating:
  interpretation: incident_aerothermal_heat_flux
  amplitude: {min: 2.5e4, max: 6.6e4}
  y_center: {min: 0.040, max: 0.160}
  t_center: {min: 90.0, max: 300.0}
  sigma_y: {min: 0.012, max: 0.035}
  sigma_t: {min: 30.0, max: 120.0}
  max_events: 3
mesh:
  # 2x refinement of the 18x24 pilot mesh in both directions.
  # The bond has 4 cells across 0.25 mm. A five-case production-physics
  # refinement check against 72x96 found <=3.02 K change in reconstructed
  # hot-face temperature and <=0.10 K at the structural interface. Halving
  # dt from 2 s to 1 s changed the checked QoIs by <=0.02 K, so the remaining
  # error is spatial rather than temporal. See docs/mesh-convergence-production.md.
  nx_tps: 24
  nx_bond: 4
  nx_back: 8
  ny: 48
time:
  dt: 2.0
  t_final: 900.0
  save_stride: 2
  horizon_candidates: [600.0, 900.0]
training:
  batch_size: 16
  epochs: 100
  learning_rate: 5.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  patience: 15
  targets_per_case: 4
  seed: 42
  # modes1/modes2 are unchanged from the pilot so the refinement isolates the
  # mesh. Nyquist here is 19 x 25, so both remain resolvable, but the retained
  # spectral fraction is halved relative to 18x24.
  modes1: 8
  modes2: 12
  width: 32
  layers: 4
  cond_hidden: 64
  temporal_hidden: 32
  forcing_embed_dim: 16
  temporal_samples: 128
  dropout: 0.0
  bond_loss_weight: 0.0
  interface_loss_weight: 0.0
  # Moderate inverse-square-root weighting across the configured thickness
  # strata. Candidate-set normalization keeps the mean training-loss scale at
  # one while giving 3 mm cases 2.83x the weight of 24 mm cases.
  thickness_loss_weight_power: 0.5
