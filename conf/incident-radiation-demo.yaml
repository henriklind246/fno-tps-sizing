study_id: tps_fno_li900_rtv560_al_incident_radiation_demo_v1
authoritative: false
seed: 42
initial_temperature: 300.0
lateral_length: 0.20
bond_thickness: 2.5e-4
backing_thickness: 2.0e-3
thickness_candidates:
  - 0.003
  - 0.005
  - 0.007
  - 0.009
  - 0.012
  - 0.015
  - 0.018
  - 0.021
  - 0.024
limits:
  bond_temperature: 450.0
  structural_interface_temperature: 400.0
validity:
  # Legacy constant-property/radiation regression configuration. The active
  # nonlinear pilot uses conf/nonlinear-pilot.yaml.
  tps_property_model: constant_effective
  hot_face:
    study_temperature_limit: 1400.0
    material_multiple_use_limit: 1590.0
  property_tables:
    allow_extrapolation: false
    minimum_temperature: 300.0
    maximum_temperature: null
  max_property_relative_deviation: 0.20
  conductivity_reference_pressure: 101325.0
  reject_cases_outside_validity: true
  reject_on_property_extrapolation: true
  reject_on_nonlinear_failure: true
  reject_on_nonphysical_temperature: true
  reject_on_energy_residual: true
  minimum_physical_temperature: 0.0
  max_relative_energy_residual: 1.0e-7
surface:
  model: incident_heat_flux_with_reradiation
  # Retained as the legacy linear-response oracle. Temperature-dependent
  # configurations must select coupled_nonlinear explicitly.
  radiation_coupling: boundary_response
  emissivity_model: constant
  emissivity: 0.77
  # Equal to the initial temperature to avoid artificial pre-heating cooling.
  radiation_sink_temperature: 300.0
  stefan_boltzmann_constant: 5.670374419e-8
  nonlinear_absolute_flux_tolerance: 1.0e-7
  nonlinear_relative_tolerance: 1.0e-10
  nonlinear_max_iterations: 100
  nonlinear_relaxation: 0.80
recent_window_fraction: 0.10
cases_per_stratum: 12
max_stage_a_cases: 1500
materials:
  # Same constant effective TPS properties as the exhausted net-flux study.
  tps:
    k: 5.96e-2
    rho_c: 1.203e5
  backing:
    k: 226.0
    rho_c: 2.484e6
bond:
  k0: 0.397
  k_min: 0.040
  rho_c: 1.6497e6
  severity: {min: 0.40, max: 0.90}
  y_center: {min: 0.030, max: 0.170}
  sigma: {min: 0.010, max: 0.025}
  max_defects: 2
heating:
  interpretation: incident_aerothermal_heat_flux
  # Initial calibration envelope only; do not generate production data from it.
  amplitude: {min: 1.0e3, max: 8.0e3}
  y_center: {min: 0.040, max: 0.160}
  t_center: {min: 90.0, max: 720.0}
  sigma_y: {min: 0.012, max: 0.035}
  sigma_t: {min: 30.0, max: 180.0}
  max_events: 3
mesh:
  nx_tps: 48
  nx_bond: 4
  nx_back: 8
  ny: 96
time:
  dt: 0.25
  t_final: 2400.0
  save_stride: 8
  horizon_candidates: [600.0, 900.0, 1200.0, 1800.0, 2400.0]
training:
  batch_size: 16
  epochs: 100
  learning_rate: 5.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  patience: 15
  targets_per_case: 4
  seed: 42
  modes1: 16
  modes2: 24
  width: 64
  layers: 4
  cond_hidden: 128
  temporal_hidden: 64
  forcing_embed_dim: 16
  temporal_samples: 128
  dropout: 0.0
  bond_loss_weight: 0.0
  interface_loss_weight: 0.0
  thickness_loss_weight_power: 0.0
